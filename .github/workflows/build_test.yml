name: build_test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: race tests + fuzz seeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Download modules
        run: go mod download

      - name: Race tests (includes fuzz seed corpora)
        run: go test -race -count=1 ./...

  cross-build:
    name: cross-compile (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build (CGO_ENABLED=0, linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "sentinel-linux-${{ matrix.goarch }}" ./cmd/sentinel
          ls -lh "sentinel-linux-${{ matrix.goarch }}"

      - name: Smoke test (amd64 only — native arch)
        if: matrix.goarch == 'amd64'
        run: ./sentinel-linux-amd64 version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-${{ matrix.goarch }}
          path: sentinel-linux-${{ matrix.goarch }}
          retention-days: 7
