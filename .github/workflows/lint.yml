name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: golangci-lint + gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt: all files formatted"

      - name: go vet
        run: go vet ./...

      # Build golangci-lint from source with the repo's Go toolchain (1.26)
      # rather than pulling a pre-built binary. Pre-built releases lag behind
      # Go and are compiled with an older toolchain (e.g. go1.24), which
      # refuses to load a module that targets a newer Go (go1.26.5).
      - name: Install golangci-lint (built with repo Go)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: golangci-lint run --timeout=5m
